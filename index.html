<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Administración Encargado de Mantenimiento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <!-- Firebase App & Realtime Database SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove, update } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcnfJFlnJKEtX_T1RDarphX2Be2rX8tEg",
      authDomain: "tatocows.firebaseapp.com",
      databaseURL: "https://tatocows-default-rtdb.firebaseio.com",
      projectId: "tatocows",
      storageBucket: "tatocows.firebasestorage.app",
      messagingSenderId: "145845925802",
      appId: "1:145845925802:web:40baed1fdbeb90b4991dd3",
      measurementId: "G-3M1F1362RN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const corralesRef = ref(db, 'corrales');
    const historialRef = ref(db, 'historial');
    const fletesRef = ref(db, 'fletes');
    const tareasRef = ref(db, 'tareas');
    const notasRef = ref(db, 'notas_rapidas');

    window.corralesData = {};
    window.historialData = [];
    window.fletesData = [];
    window.tareasData = {};
    window.notasData = {};

    onValue(corralesRef, (snapshot) => {
      window.corralesData = snapshot.val() || {};
      renderCorrales();
      renderStats();
      populateSelects();
    });

    onValue(historialRef, (snapshot) => {
      const data = snapshot.val() || {};
      window.historialData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      window.historialData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      renderHistorial();
    });

    onValue(fletesRef, (snapshot) => {
      const data = snapshot.val() || {};
      window.fletesData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      window.fletesData.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      renderFletes();
      renderStats();
    });

    onValue(tareasRef, (snapshot) => {
      window.tareasData = snapshot.val() || {};
      renderKanban();
      renderStats();
    });

    onValue(notasRef, (snapshot) => {
      window.notasData = snapshot.val() || {};
      renderNotas();
    });

    window.crearCorral = function() {
      const nombre = document.getElementById('nombreCorralInput').value.trim();
      const observacion = document.getElementById('obsCorralInput').value.trim();
      const color = document.getElementById('colorCorralInput').value;
      if (!nombre) return;
      set(push(corralesRef), { nombre, observacion, color, cantidad: 0 }).then(() => {
        document.getElementById('nombreCorralInput').value = '';
        document.getElementById('obsCorralInput').value = '';
        toggleModal('modalNuevoCorral', false);
      });
    };

    window.abrirEditarCorral = function(id) {
      const corral = window.corralesData[id];
      if (!corral) return;
      document.getElementById('editCorralIdInput').value = id;
      document.getElementById('editNombreCorralInput').value = corral.nombre || '';
      document.getElementById('editObsCorralInput').value = corral.observacion || '';
      document.getElementById('editColorCorralInput').value = corral.color || 'emerald';
      toggleModal('modalEditarCorral', true);
    };

    window.guardarEdicionCorral = function() {
      const id = document.getElementById('editCorralIdInput').value;
      const nombre = document.getElementById('editNombreCorralInput').value.trim();
      const observacion = document.getElementById('editObsCorralInput').value.trim();
      const color = document.getElementById('editColorCorralInput').value;
      if (!id || !nombre) return alert("El nombre no puede estar vacío.");
      update(ref(db, `corrales/${id}`), { nombre, observacion, color }).then(() => toggleModal('modalEditarCorral', false));
    };

    window.eliminarCorral = function(id, nombre) {
      if (confirm(`¿Eliminar el lote "${nombre}"?`)) remove(ref(db, `corrales/${id}`));
    };

    window.ejecutarIngreso = function() {
      const corralId = document.getElementById('ingCorralSelect').value;
      const cantidad = parseInt(document.getElementById('ingCantidadInput').value, 10);
      const motivo = document.getElementById('ingMotivoSelect').value;
      const usuario = document.getElementById('ingUsuarioInput').value.trim() || 'Operador';
      const notas = document.getElementById('ingNotasInput').value.trim();
      if (!corralId || isNaN(cantidad) || cantidad <= 0) return alert("Ingresá una cantidad válida");
      const corral = window.corralesData[corralId];
      if (!corral) return;
      toggleModal('modalIngresar', false);
      set(ref(db, `corrales/${corralId}/cantidad`), (corral.cantidad || 0) + cantidad);
      set(push(historialRef), { corralId, nombreCorral: corral.nombre, tipo: 'SUMAR', cantidad, motivo, notas, usuario, timestamp: Date.now() });
    };

    window.ejecutarEgreso = function() {
      const corralId = document.getElementById('egCorralSelect').value;
      const cantidad = parseInt(document.getElementById('egCantidadInput').value, 10);
      const motivo = document.getElementById('egMotivoSelect').value;
      const usuario = document.getElementById('egUsuarioInput').value.trim() || 'Operador';
      const notas = document.getElementById('egNotasInput').value.trim();
      if (!corralId || isNaN(cantidad) || cantidad <= 0) return alert("Ingresá una cantidad válida");
      const corral = window.corralesData[corralId];
      if (!corral) return;
      if (cantidad > (corral.cantidad || 0) && !confirm(`La cantidad supera el stock (${corral.cantidad || 0}). ¿Continuar?`)) return;
      toggleModal('modalEgresar', false);
      set(ref(db, `corrales/${corralId}/cantidad`), Math.max(0, (corral.cantidad || 0) - cantidad));
      set(push(historialRef), { corralId, nombreCorral: corral.nombre, tipo: 'RESTAR', cantidad, motivo, notas, usuario, timestamp: Date.now() });
    };

    window.ejecutarTraslado = function() {
      const origenId = document.getElementById('trOrigenSelect').value;
      const destinoId = document.getElementById('trDestinoSelect').value;
      const cantidad = parseInt(document.getElementById('trCantidadInput').value, 10);
      const usuario = document.getElementById('trUsuarioInput').value.trim() || 'Operador';
      const notas = document.getElementById('trNotasInput').value.trim();
      if (!origenId || !destinoId || isNaN(cantidad) || cantidad <= 0 || origenId === destinoId) return alert("Verificá los datos del traslado.");
      const corralOrigen = window.corralesData[origenId];
      const corralDestino = window.corralesData[destinoId];
      if (!corralOrigen || !corralDestino) return;
      toggleModal('modalTraslado', false);
      set(ref(db, `corrales/${origenId}/cantidad`), Math.max(0, (corralOrigen.cantidad || 0) - cantidad));
      set(ref(db, `corrales/${destinoId}/cantidad`), (corralDestino.cantidad || 0) + cantidad);
      set(push(historialRef), { tipo: 'TRASLADO', cantidad, motivo: 'Traslado entre lotes', nombreCorral: `Desde ${corralOrigen.nombre} hacia ${corralDestino.nombre}`, notas, usuario, timestamp: Date.now() });
    };

    window.guardarFlete = function() {
      const transportista = document.getElementById('fleteTransportista').value.trim();
      const chofer = document.getElementById('fleteChofer').value.trim();
      const guia = document.getElementById('fleteGuia').value.trim();
      const destino = document.getElementById('fleteDestino').value.trim();
      const cantidad = parseInt(document.getElementById('fleteCantidad').value, 10);
      const costo = parseFloat(document.getElementById('fleteCosto').value) || 0;
      const estadoPago = document.getElementById('fleteEstadoPago').value;
      if (!transportista || isNaN(cantidad) || cantidad <= 0) return alert("Completá transportista y cantidad.");
      set(push(fletesRef), { transportista, chofer, guia, destino, cantidad, costo, estadoPago, timestamp: Date.now() }).then(() => toggleModal('modalFlete', false));
    };

    window.toggleEstadoPagoFlete = function(id, actual) {
      update(ref(db, `fletes/${id}`), { estadoPago: actual === 'Pagado' ? 'Pendiente' : 'Pagado' });
    };

    window.eliminarFlete = function(id) { if (confirm("¿Eliminar flete?")) remove(ref(db, `fletes/${id}`)); };

    window.guardarTarea = function() {
      const titulo = document.getElementById('tareaTituloInput').value.trim();
      const observaciones = document.getElementById('tareaObsInput').value.trim();
      if (!titulo) return alert("Ingresá la tarea.");
      set(push(tareasRef), { titulo, observaciones, estado: 'tomado', archivada: false, timestamp: Date.now() }).then(() => toggleModal('modalNuevaTarea', false));
    };

    window.cambiarEstadoTarea = function(id, estado) { update(ref(db, `tareas/${id}`), { estado }); };
    window.editarObsTarea = function(id) {
      const nueva = prompt("Actualizar observaciones:", window.tareasData[id]?.observaciones || "");
      if (nueva !== null) update(ref(db, `tareas/${id}`), { observaciones: nueva.trim() });
    };
    window.eliminarTarea = function(id) { if (confirm("¿Eliminar tarea?")) remove(ref(db, `tareas/${id}`)); };
    
    window.archivarCompletadas = function() {
      let count = 0;
      Object.keys(window.tareasData).forEach(id => {
        if (window.tareasData[id].estado === 'completado' && !window.tareasData[id].archivada) {
          update(ref(db, `tareas/${id}`), { archivada: true, fechaArchivado: Date.now() });
          count++;
        }
      });
      alert(count > 0 ? `Se archivaron ${count} tareas.` : "No hay tareas completadas para archivar.");
    };

    window.restaurarTarea = function(id) { update(ref(db, `tareas/${id}`), { archivada: false }); };

    window.guardarNotaRapida = function() {
      const texto = document.getElementById('notaRapidaInput').value.trim();
      if (!texto) return;
      set(push(notasRef), { texto, timestamp: Date.now() }).then(() => document.getElementById('notaRapidaInput').value = '');
    };
    window.eliminarNotaRapida = function(id) { remove(ref(db, `notas_rapidas/${id}`)); };

    window.ejecutarReinicioSeguro = function() {
      if (document.getElementById('inputPalabraBorrar').value.trim() !== "BORRAR") return alert("Escribí BORRAR en mayúsculas.");
      if (document.getElementById('chkCorrales').checked) set(corralesRef, null);
      else if (document.getElementById('chkCabezas').checked) Object.keys(window.corralesData).forEach(id => set(ref(db, `corrales/${id}/cantidad`), 0));
      if (document.getElementById('chkFletes').checked) set(fletesRef, null);
      if (document.getElementById('chkHistorial').checked) set(historialRef, null);
      if (document.getElementById('chkTareas').checked) set(tareasRef, null);
      if (document.getElementById('chkNotas').checked) set(notasRef, null);
      alert("Limpieza ejecutada.");
      toggleModal('modalReset', false);
      document.getElementById('inputPalabraBorrar').value = '';
    };

    // Funciones de Renderizado Global
    function renderStats() {
      const corrales = window.corralesData || {};
      const keys = Object.keys(corrales);
      let total = keys.reduce((acc, k) => acc + (corrales[k].cantidad || 0), 0);
      let tareasActivas = Object.values(window.tareasData || {}).filter(t => !t.archivada).length;
      document.getElementById('statTotalVacas').innerText = total;
      document.getElementById('statTotalCorrales').innerText = keys.length;
      document.getElementById('statTotalFletes').innerText = window.fletesData.length;
      document.getElementById('statTotalTareas').innerText = tareasActivas;
    }

    function renderCorrales() {
      const container = document.getElementById('listaCorrales');
      const corrales = window.corralesData || {};
      const keys = Object.keys(corrales);
      if (keys.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-sm">No hay lotes registrados. Creá el primero arriba.</div>`;
        return;
      }
      const colorMap = {
        emerald: 'border-l-8 border-emerald-600 bg-emerald-50/20',
        blue: 'border-l-8 border-blue-600 bg-blue-50/20',
        amber: 'border-l-8 border-amber-500 bg-amber-50/20',
        purple: 'border-l-8 border-purple-600 bg-purple-50/20',
        rose: 'border-l-8 border-rose-600 bg-rose-50/20',
        slate: 'border-l-8 border-slate-400 bg-white'
      };
      container.innerHTML = keys.map(id => {
        const c = corrales[id];
        return `
          <div class="bg-white p-4 rounded-xl shadow flex items-center justify-between gap-3 ${colorMap[c.color] || colorMap.emerald}">
            <div class="min-w-0 flex-1">
              <h3 class="font-black text-base text-slate-800">${c.nombre}</h3>
              <p class="text-xs text-slate-600 mt-0.5">${c.observacion || '<span class="italic text-slate-400">Sin observación</span>'}</p>
            </div>
            <div class="flex items-center gap-2">
              <div class="text-right mr-1">
                <span class="text-xl font-black text-emerald-700">${c.cantidad || 0}</span>
                <span class="block text-[10px] text-slate-500">cabezas</span>
              </div>
              <button onclick="abrirEditarCorral('${id}')" class="text-slate-400 hover:text-blue-600 p-2 bg-white rounded-lg shadow-sm"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="eliminarCorral('${id}', '${c.nombre.replace(/'/g, "\\'")}')" class="text-slate-300 hover:text-rose-500 p-2"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    function populateSelects() {
      const opciones = Object.keys(window.corralesData || {}).map(id => 
        `<option value="${id}">${window.corralesData[id].nombre} (${window.corralesData[id].cantidad || 0} cab.)</option>`
      ).join('');
      ['ingCorralSelect', 'egCorralSelect', 'trOrigenSelect', 'trDestinoSelect'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = opciones;
      });
    }

    function renderHistorial() {
      const container = document.getElementById('listaHistorial');
      const list = window.historialData || [];
      if (list.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-slate-400 text-sm">Sin movimientos registrados aún.</div>`;
        return;
      }
      container.innerHTML = list.map(h => {
        const fecha = h.timestamp ? new Date(h.timestamp).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        const esSuma = h.tipo === 'SUMAR';
        const esTraslado = h.tipo === 'TRASLADO';
        
        let signoIcono = esTraslado ? '<i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>' : (esSuma ? '+' : '-');
        let colorClase = esTraslado ? 'text-blue-600 bg-blue-50' : (esSuma ? 'text-emerald-600 bg-emerald-50' : 'text-rose-600 bg-rose-50');
        let textoCantidad = esTraslado ? h.cantidad : (esSuma ? '+' + h.cantidad : '-' + h.cantidad);

        return `
          <div class="p-3 flex items-center justify-between text-sm">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${colorClase}">
                ${signoIcono}
              </span>
              <div>
                <p class="font-semibold text-slate-800">${h.nombreCorral} &bull; <span class="text-slate-500">${h.motivo}</span></p>
                <p class="text-xs text-slate-400">${fecha} ${h.usuario ? '• ' + h.usuario : ''} ${h.notas ? '• ' + h.notas : ''}</p>
              </div>
            </div>
            <span class="font-bold text-base ${esTraslado ? 'text-blue-600' : (esSuma ? 'text-emerald-600' : 'text-rose-600')}">
              ${textoCantidad}
            </span>
          </div>
        `;
      }).join('');
    }

    function renderFletes() {
      const container = document.getElementById('listaFletes');
      const list = window.fletesData || [];
      let totalGastado = list.reduce((a, b) => a + (b.costo || 0), 0);
      let totalPendiente = list.filter(f => f.estadoPago === 'Pendiente').reduce((a, b) => a + (b.costo || 0), 0);
      document.getElementById('fletesTotalGastado').innerText = '$' + totalGastado.toLocaleString();
      document.getElementById('fletesTotalPendiente').innerText = '$' + totalPendiente.toLocaleString();
      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-sm">No hay fletes registrados.</div>`;
        return;
      }
      container.innerHTML = list.map(f => `
        <div class="bg-white p-4 rounded-xl shadow space-y-2 text-sm">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-base text-slate-800"><i class="fa-solid fa-truck text-blue-600 mr-1"></i> ${f.transportista}</h3>
              <p class="text-xs text-slate-500">${f.chofer ? 'Chofer: ' + f.chofer : ''}</p>
            </div>
            <button onclick="eliminarFlete('${f.id}')" class="text-slate-300 hover:text-rose-500 p-1"><i class="fa-solid fa-trash"></i></button>
          </div>
          <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-lg text-xs">
            <div><span class="text-slate-400">Guía:</span> <strong>${f.guia || 'N/D'}</strong></div>
            <div><span class="text-slate-400">Cantidad:</span> <strong class="text-emerald-700">${f.cantidad} cab.</strong></div>
            <div><span class="text-slate-400">Destino:</span> <strong>${f.destino || 'N/D'}</strong></div>
            <div><span class="text-slate-400">Costo:</span> <strong>$${(f.costo || 0).toLocaleString()}</strong></div>
          </div>
          <div class="flex justify-between items-center pt-1">
            <button onclick="toggleEstadoPagoFlete('${f.id}', '${f.estadoPago}')" class="text-xs text-blue-600 hover:underline font-semibold">Cambiar a ${f.estadoPago === 'Pagado' ? 'Pendiente' : 'Pagado'}</button>
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${f.estadoPago === 'Pagado' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">Pago: ${f.estadoPago}</span>
          </div>
        </div>
      `).join('');
    }

    function renderKanban() {
      const tareas = window.tareasData || {};
      const cols = { tomado: '', en_ejecucion: '', completado: '' };
      const counts = { tomado: 0, en_ejecucion: 0, completado: 0 };
      let archivadasHTML = '';
      let cArchivadas = 0;

      Object.keys(tareas).forEach(id => {
        const t = tareas[id];
        if (t.archivada) {
          cArchivadas++;
          archivadasHTML += `
            <div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-start gap-2 text-xs">
              <div><p class="font-bold text-slate-800">${t.titulo}</p><p class="text-slate-600">${t.observaciones || ''}</p></div>
              <button onclick="restaurarTarea('${id}')" class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded font-bold">Restaurar</button>
            </div>
          `;
          return;
        }
        counts[t.estado]++;
        cols[t.estado] += `
          <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2 text-xs">
            <div class="flex justify-between items-start">
              <span class="font-bold text-slate-800 text-sm">${t.titulo}</span>
              <button onclick="eliminarTarea('${id}')" class="text-slate-300 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div onclick="editarObsTarea('${id}')" class="text-slate-600 bg-slate-50 p-2 rounded cursor-pointer border border-dashed border-slate-200">
              ${t.observaciones || 'Sin detalles (tocá para editar)'}
            </div>
            <div class="flex justify-between items-center pt-1 border-t">
              ${t.estado !== 'tomado' ? `<button onclick="cambiarEstadoTarea('${id}', '${t.estado === 'completado' ? 'en_ejecucion' : 'tomado'}')" class="px-2 py-1 bg-slate-100 rounded text-slate-600"><i class="fa-solid fa-chevron-left"></i></button>` : '<span></span>'}
              ${t.estado !== 'completado' ? `<button onclick="cambiarEstadoTarea('${id}', '${t.estado === 'tomado' ? 'en_ejecucion' : 'completado'}')" class="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-bold rounded">Avanzar <i class="fa-solid fa-chevron-right ml-1"></i></button>` : '<span class="text-emerald-600 font-bold">¡Listo!</span>'}
            </div>
          </div>
        `;
      });

      document.getElementById('colTomado').innerHTML = cols.tomado || '<p class="text-xs text-slate-400 text-center py-4">Sin tareas</p>';
      document.getElementById('colEjecucion').innerHTML = cols.en_ejecucion || '<p class="text-xs text-slate-400 text-center py-4">Sin tareas</p>';
      document.getElementById('colCompletado').innerHTML = cols.completado || '<p class="text-xs text-slate-400 text-center py-4">Sin tareas</p>';
      document.getElementById('countTomado').innerText = counts.tomado;
      document.getElementById('countEjecucion').innerText = counts.en_ejecucion;
      document.getElementById('countCompletado').innerText = counts.completado;
      document.getElementById('countArchivadasBtn').innerText = cArchivadas;
      const arcEl = document.getElementById('listaTareasArchivadas');
      if (arcEl) arcEl.innerHTML = archivadasHTML || '<p class="text-xs text-slate-400 text-center py-6">No hay tareas archivadas.</p>';
    }

    function renderNotas() {
      const container = document.getElementById('listaNotasRapidas');
      const notas = window.notasData || {};
      const keys = Object.keys(notas);
      if (keys.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 col-span-2 text-center py-2">No hay notas rápidas.</p>`;
        return;
      }
      container.innerHTML = keys.map(id => `
        <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-lg flex justify-between items-start text-xs shadow-sm">
          <p class="text-slate-800 break-words pr-2">${notas[id].texto}</p>
          <button onclick="eliminarNotaRapida('${id}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

  <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-cow"></i> Administracion Encargado de Mantenimiento</h1>
        <p class="text-xs text-emerald-200">programado para Esteban Company</p>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-6">
    <div class="grid grid-cols-4 bg-white rounded-xl shadow p-1 gap-1 text-center">
      <button onclick="cambiarTab('corrales')" id="btnTabCorrales" class="py-2 font-bold text-xs rounded-lg bg-emerald-
